# Build merged site, upload FTP to Hostinger, and keep a downloadable artifact.
#
# GitHub → Settings → Secrets and variables → Actions → New repository secret:
#   HOSTINGER_FTP_HOST       FTP hostname from hPanel (Files → FTP Accounts)
#   HOSTINGER_FTP_USERNAME
#   HOSTINGER_FTP_PASSWORD
#
# Hostinger shared FTP on port 21 is usually plain FTP (not implicit TLS). If you use
# explicit FTPS in hPanel, try protocol "ftps" or "ftps-legacy" per SamKirkland/FTP-Deploy-Action docs.

name: Deploy to Hostinger (FTP)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: hostinger-ftp-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: astro/package-lock.json

      # setup-node cache restores nothing useful without an install — astro must be in node_modules
      - name: Install dependencies
        working-directory: astro
        run: npm ci

      - name: Build deploy bundle
        run: sh scripts/build-deploy.sh

      - uses: actions/upload-artifact@v4
        with:
          name: pithead-public_html
          path: deploy/
          if-no-files-found: error

  ftp:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pithead-public_html
          path: deploy

      # Strip accidental ftp://, paths, ports, newlines — common cause of ENOTFOUND
      - name: Normalize FTP hostname
        id: ftp_host
        env:
          RAW: ${{ secrets.HOSTINGER_FTP_HOST }}
        run: |
          python3 << 'PY'
          import os, re, socket
          raw = (os.environ.get("RAW") or "").strip()
          if not raw:
              print("::error::HOSTINGER_FTP_HOST secret is empty. Use hostname only, e.g. ftp.example.com")
              raise SystemExit(1)
          h = re.sub(r"^(ftps?|sftp)://", "", raw, flags=re.I).strip().rstrip("/")
          h = h.split("/")[0]
          if h.startswith("[") and "]" in h:
              pass
          elif ":" in h:
              host, _, port = h.rpartition(":")
              if port.isdigit():
                  h = host
          try:
              socket.getaddrinfo(h, None)
          except socket.gaierror:
              print("::error::Cannot resolve FTP host %r (ENOTFOUND). In GitHub → Settings → Secrets, set HOSTINGER_FTP_HOST to the exact FTP server from hPanel (Files → FTP Accounts), hostname only — no https://, no spaces." % (h,))
              raise SystemExit(1)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"server={h}\n")
          PY

      - name: Upload to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp_host.outputs.server }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./deploy/
          # Hostinger FTP logins usually land IN public_html already; ./public_html/ would nest files
          # and the live site would keep showing the host default page. If your FTP root is above
          # public_html, set server-dir to ./public_html/ instead.
          server-dir: ./
          exclude: |
            **/_inc/config.local.php
            **/_inc/logs/**
            **/uploads/**
          log-level: standard
