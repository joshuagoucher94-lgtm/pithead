# Build merged site, upload FTP to Hostinger, and keep a downloadable artifact.
#
# GitHub → Settings → Secrets and variables → Actions → New repository secret:
#   HOSTINGER_FTP_HOST       FTP hostname from hPanel (Files → FTP Accounts)
#   HOSTINGER_FTP_USERNAME
#   HOSTINGER_FTP_PASSWORD
#
# If the FTP step fails, open this file and try protocol "ftp" instead of ftps-legacy,
# or the port shown in hPanel (still usually 21).

name: Deploy to Hostinger (FTP)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: hostinger-ftp-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: astro/package-lock.json

      - name: Build deploy bundle
        run: chmod +x scripts/build-deploy.sh && ./scripts/build-deploy.sh

      - uses: actions/upload-artifact@v4
        with:
          name: pithead-public_html
          path: deploy/
          if-no-files-found: error

  ftp:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pithead-public_html
          path: deploy

      - name: Upload to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_HOST }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          port: 21
          protocol: ftps-legacy
          local-dir: ./deploy/
          server-dir: ./public_html/
          exclude: |
            **/_inc/config.local.php
            **/_inc/logs/**
            **/uploads/**
          log-level: standard
