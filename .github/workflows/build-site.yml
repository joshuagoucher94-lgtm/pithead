# Manual only: download zip artifact without FTP deploy.
# For push-to-Hostinger automation use "Deploy to Hostinger (FTP)" workflow.

name: Build site for Hostinger (artifact only)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: astro/package-lock.json

      - name: Install dependencies
        working-directory: astro
        run: npm ci

      - name: Build deploy bundle
        run: sh scripts/build-deploy.sh

      - uses: actions/upload-artifact@v4
        with:
          name: pithead-public_html
          path: deploy/
          if-no-files-found: error
